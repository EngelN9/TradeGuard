minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
      - id: ruff-lint
        name: ruff lint
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
      - id: workflow-permissions
        name: workflow permissions
        entry: uv run python scripts/validate_workflows.py
        language: system
        pass_filenames: false
      - id: secret-baseline
        name: secret baseline
        entry: uv run python scripts/scan_secrets.py
        language: system
        pass_filenames: false
