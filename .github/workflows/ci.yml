name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.32
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy
      - name: Run unit tests
        run: uv run pytest -m unit
      - name: Run property tests
        run: uv run pytest -m property
      - name: Run integration tests
        run: uv run pytest -m integration
      - name: Run contract tests
        run: uv run pytest -m contract
      - name: Run replay tests
        run: uv run pytest -m replay
      - name: Collect deterministic test and coverage evidence
        run: |
          mkdir -p artifacts/evidence/bootstrap/tests
          uv run pytest -m "not connected" \
            --cov=tradeguard \
            --cov-report=term-missing \
            --cov-report=xml:artifacts/evidence/bootstrap/tests/coverage.xml \
            --junitxml=artifacts/evidence/bootstrap/tests/all.xml
      - name: Build Python package
        run: uv build
      - name: Collect bootstrap evidence
        run: uv run python scripts/collect_evidence.py

  dashboard:
    name: Dashboard check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix web
      - name: Typecheck
        run: npm run check --prefix web
      - name: Test
        run: npm test --prefix web
      - name: Build
        run: npm run build --prefix web

  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.32
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Validate workflow permissions and immutable pins
        run: uv run python scripts/validate_workflows.py
      - name: Scan for secret-shaped content
        run: uv run python scripts/scan_secrets.py
      - name: Validate Compose configuration
        run: docker compose config --quiet
